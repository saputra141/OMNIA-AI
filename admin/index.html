<!doctype html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIA AI | Advanced Admin Dashboard</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                        dark: '#0f172a',
                        surface: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f1a; scroll-behavior: smooth; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="app" class="min-h-screen flex flex-col lg:flex-row">
        <!-- Dashboard akan dirender oleh src.js -->
        <div class="flex items-center justify-center w-full h-screen">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-12 h-12 bg-primary rounded-full mb-4"></div>
                <p class="text-sm text-slate-400">Inisialisasi Antarmuka OMNIA...</p>
            </div>
        </div>
    </div>
    <script type="module" src="/src.js"></script>
</body>
</html>
