<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIA Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tighter">OMNIA <span class="text-blue-500">CORE</span></h1>
        <div id="status" class="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded">System Online</div>
    </nav>

    <main class="p-6 max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Total Requests</p>
                <h2 id="totalRequests" class="text-3xl font-bold">0</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Active Provider</p>
                <h2 class="text-3xl font-bold text-blue-400">GPT-4o</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-sm">Security Token</p>
                <input type="password" id="adminToken" class="bg-transparent border-none text-sm w-full focus:ring-0" placeholder="Enter Token">
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-semibold">Recent Activity Logs</h3>
                <button onclick="fetchLogs()" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded-lg transition">Refresh</button>
            </div>
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-900/50 text-slate-400">
                    <tr>
                        <th class="p-4">ID</th>
                        <th class="p-4">User</th>
                        <th class="p-4">Action</th>
                        <th class="p-4">Provider</th>
                        <th class="p-4">Time</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <!-- Logs injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="src.js"></script>
</body>
</html>
