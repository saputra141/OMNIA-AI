<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIA AI - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">OMNIA AI</h1>
                <p class="text-slate-400 text-sm">Video Generation Management System</p>
            </div>
            <button onclick="loadTasks()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition-all flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass p-6 rounded-2xl">
                <h3 class="text-slate-400 text-sm font-semibold mb-2">TOTAL TASKS</h3>
                <p id="stat-total" class="text-4xl font-bold text-white">0</p>
            </div>
            <div class="glass p-6 rounded-2xl border-l-4 border-yellow-500">
                <h3 class="text-slate-400 text-sm font-semibold mb-2">PENDING</h3>
                <p id="stat-pending" class="text-4xl font-bold text-white">0</p>
            </div>
            <div class="glass p-6 rounded-2xl border-l-4 border-green-500">
                <h3 class="text-slate-400 text-sm font-semibold mb-2">COMPLETED</h3>
                <p id="stat-completed" class="text-4xl font-bold text-white">0</p>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/50">
                    <tr>
                        <th class="p-4 font-semibold text-slate-300">Prompt</th>
                        <th class="p-4 font-semibold text-slate-300">Provider</th>
                        <th class="p-4 font-semibold text-slate-300">Status</th>
                        <th class="p-4 font-semibold text-slate-300">Created At</th>
                        <th class="p-4 font-semibold text-slate-300">Result</th>
                    </tr>
                </thead>
                <tbody id="task-body">
                    <!-- Data injected by src.js -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="src.js"></script>
</body>
</html>
